<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DC Hounds — DC Siting Intelligence</title>
  <!-- Google Fonts: DM Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Leaflet.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>

  <!-- Header Menu Bar -->
  <header>
    <div class="logo">DC Hounds</div>
    
    <!-- Skyscanner-style search bar -->
    <div class="skyscanner-bar">
      <div class="sky-slot"><label for="param-capacity">Capacity</label><div class="sky-input-wrapper"><input type="number" id="param-capacity" min="5" max="500" value="50"><span class="sky-unit">MW</span></div></div>
      <div class="sky-divider"></div>
      <div class="sky-slot"><label for="param-footprint">Footprint</label><div class="sky-input-wrapper"><input type="number" id="param-footprint" min="500" max="100000" value="15000"><span class="sky-unit">m²</span></div></div>
      <div class="sky-divider"></div>
      
      <!-- Priority Dropdown Slot -->
      <div class="sky-slot dropdown-trigger" id="priority-dropdown-trigger">
        <label>Prioritize</label>
        <div class="sky-dropdown-value">
          <span id="current-priority-text">Balanced</span>
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" class="dropdown-chevron">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
        
        <!-- Collapsible priorities section -->
        <div class="sky-dropdown-menu" id="priority-dropdown-menu" style="display: none;">
          <div class="sky-dropdown-item active" data-value="balanced">Balanced</div>
          <div class="sky-dropdown-item" data-value="price">Price</div>
          <div class="sky-dropdown-item" data-value="co2">CO2 Efficiency</div>
        </div>
      </div>
      
      <!-- Submit Search Button with Arrow Icon -->
      <button class="sky-submit-btn" id="btn-submit-search" title="Apply Changes">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
  </header>

  <!-- Split Main Layout -->
  <main class="split-layout">
    <!-- Left 2/3: Permanent Europe Map -->
    <section class="map-container">
      <div id="europe-map"></div>
    </section>

    <!-- Right 1/3: Synthetic Locations List & Details -->
    <section class="sidebar-results">
      
      <div id="panel-list">
        <h2>Optimal Locations</h2>
        <div class="rankings" id="rankings-list">
          <!-- Dynamically populated via JS -->
        </div>
      </div>

      <div id="panel-detail" style="display: none;">
        <button id="btn-back-list" class="btn-back">← Back to List</button>
        <div class="detail-header-row">
          <h2 id="detail-title">Location Details</h2>
          <div class="detail-actions-top">
            <button id="btn-save-search" class="btn-icon-only" title="Save search parameters">
              <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
            </button>
            <button id="btn-print-site" class="btn-icon-only" title="Print location details">
              <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
              </svg>
            </button>
          </div>
        </div>
        <div id="detail-country" style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem;">Country</div>
        
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-val" id="detail-price">€0</div>
            <div class="metric-lbl">Energy Cost</div>
          </div>
          <div class="metric-card">
            <div class="metric-val" id="detail-co2">0 g</div>
            <div class="metric-lbl">CO2 Intensity</div>
          </div>
          <div class="metric-card">
            <div class="metric-val" id="detail-land">€0</div>
            <div class="metric-lbl">Land Cost</div>
          </div>
          <div class="metric-card">
            <div class="metric-val" id="detail-score">0%</div>
            <div class="metric-lbl">Suitability</div>
          </div>
        </div>

        <h3 style="margin: 1.25rem 0 0.5rem 0; font-size: 0.8rem; color: var(--accent); letter-spacing: 0.05em;">Optimized Supply Mix</h3>
        <div class="mix-container" id="detail-mix-chart">
          <!-- Dynamic progress bars -->
        </div>

        <p id="detail-explanation" style="font-size: 0.77rem; line-height: 1.4; color: var(--text-muted); margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 0.75rem;"></p>
      </div>

    </section>
  </main>

  <!-- Saved Searches & Profile Page -->
  <main id="profile-page" class="profile-layout" style="display: none;">
    <section class="profile-card" id="profile-searches-card"><button class="btn-back btn-back-dash">← Back to Dashboard</button><h2 style="margin-top: 1rem;">Saved Researches</h2><div id="saved-searches-list" class="saved-list"></div></section>
    
    <section class="profile-card" id="profile-form-card" style="display: none;">
      <button class="btn-back btn-back-dash">← Back to Dashboard</button>
      <h2 style="margin-top: 1rem;">User Profile</h2>
      <form id="user-profile-form" style="margin-top: 1.25rem; display: flex; flex-direction: column; gap: 1rem;">
        <div class="form-group" style="display: flex; gap: 0.75rem;"><div style="flex: 1; display: flex; flex-direction: column; gap: 0.35rem;"><label style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">First Name</label><input type="text" id="user-firstname" placeholder="John" style="background: rgba(11, 16, 32, 0.8); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; color: var(--text); outline: none; width: 100%;"></div><div style="flex: 1; display: flex; flex-direction: column; gap: 0.35rem;"><label style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Last Name</label><input type="text" id="user-lastname" placeholder="Doe" style="background: rgba(11, 16, 32, 0.8); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; color: var(--text); outline: none; width: 100%;"></div></div>
        <div class="form-group" style="display: flex; flex-direction: column; gap: 0.35rem;"><label style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Email Address</label><input type="email" id="user-email" placeholder="john.doe@hyperscaler.com" style="background: rgba(11, 16, 32, 0.8); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; color: var(--text); outline: none;"></div>
        <div class="form-group" style="display: flex; flex-direction: column; gap: 0.35rem;"><label style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Company</label><input type="text" id="user-company" placeholder="Hyperscaler Corp" style="background: rgba(11, 16, 32, 0.8); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; color: var(--text); outline: none;"></div>
        <div class="form-group" style="display: flex; flex-direction: column; gap: 0.35rem;"><label style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Corporate Role</label><input type="text" id="user-role" placeholder="Infrastructure CFO" style="background: rgba(11, 16, 32, 0.8); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; color: var(--text); outline: none;"></div>
        <button type="submit" class="btn-action-outline" style="align-self: flex-start; margin-top: 0.5rem; padding: 0.5rem 1rem;">Save Profile</button>
      </form>
    </section>
  </main>

  <!-- Exploding profile buttons -->
  <button class="exploding-btn" id="btn-opt-profile">Personal Profile</button>
  <button class="exploding-btn" id="btn-opt-settings">Settings</button>

  <!-- Profile Circle Button (bottom-left, orange-empty) -->
  <button id="profile-circle" title="User Profile">👤</button>

  <!-- Leaflet.js JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <!-- Application Logic -->
  <script src="app.js?v=14"></script>
</body>
</html>
