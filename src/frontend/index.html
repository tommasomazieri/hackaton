<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>DC Hound</title>
<meta name="description" content="Rank EU regions for a data-centre brief by grid congestion, carbon, cost and connectivity.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23e3a651'/%3E%3Cg fill='%23141925'%3E%3Crect x='12.5' y='21' width='8.5' height='12' rx='4.25' transform='rotate(-22 16.75 27)'/%3E%3Crect x='22' y='12' width='8.5' height='12.5' rx='4.25' transform='rotate(-6 26.25 18.25)'/%3E%3Crect x='33.5' y='12' width='8.5' height='12.5' rx='4.25' transform='rotate(6 37.75 18.25)'/%3E%3Crect x='43' y='21' width='8.5' height='12' rx='4.25' transform='rotate(22 47.25 27)'/%3E%3Crect x='18' y='31' width='28' height='21' rx='8'/%3E%3C/g%3E%3Cg fill='%23e3a651'%3E%3Crect x='24' y='37.5' width='16' height='3' rx='1.5'/%3E%3Crect x='24' y='43.5' width='16' height='3' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>

<div class="app" id="app">

  <header class="top">
    <p class="brand"><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#e3a651"/><g fill="#141925"><rect x="12.5" y="21" width="8.5" height="12" rx="4.25" transform="rotate(-22 16.75 27)"/><rect x="22" y="12" width="8.5" height="12.5" rx="4.25" transform="rotate(-6 26.25 18.25)"/><rect x="33.5" y="12" width="8.5" height="12.5" rx="4.25" transform="rotate(6 37.75 18.25)"/><rect x="43" y="21" width="8.5" height="12" rx="4.25" transform="rotate(22 47.25 27)"/><rect x="18" y="31" width="28" height="21" rx="8"/></g><g fill="#e3a651"><rect x="24" y="37.5" width="16" height="3" rx="1.5"/><rect x="24" y="43.5" width="16" height="3" rx="1.5"/></g></svg>DC HOUND</p>

    <form class="brief" id="brief" aria-label="Data-centre brief">
      <div class="brief-slot">
        <label for="in-mw">IT load</label>
        <div class="brief-input"><input id="in-mw" type="number" inputmode="decimal" min="1" max="10000" step="1" value="50"><span class="unit">MW</span></div>
      </div>
      <span class="brief-rule" aria-hidden="true"></span>
      <div class="brief-slot">
        <label for="in-m2">Footprint</label>
        <div class="brief-input"><input id="in-m2" type="number" inputmode="decimal" min="100" max="100000000" step="100" value="15000"><span class="unit">m²</span><span class="brief-ha" id="in-ha">1.5 ha</span></div>
      </div>
      <button class="brief-go" id="btn-go" type="submit" aria-label="Rank now" title="Ranks update as you type. Enter ranks now.">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="top-right">
      <button type="button" class="fault" id="st-faults" hidden></button>
      <button type="button" class="btn" id="btn-sources" aria-pressed="false">Sources</button>
      <button type="button" class="btn btn-amber" id="btn-export">Export report</button>
    </div>
  </header>

  <main class="split">
    <section class="map-wrap" aria-label="Map of ranked regions">
      <div id="map"></div>
      <div class="ledger" id="ledger" role="group" aria-label="Countries included"><div class="ledger-row" id="ledger-row"></div></div>
      <div class="legend" aria-hidden="true">
        <span><i class="lg-dot"></i>Region (NUTS 3)</span>
        <span><i class="lg-pin">1</i>Top 10</span>
        <span><i class="lg-off"></i>Country left out</span>
      </div>
      <aside class="dock" id="dock" hidden tabindex="-1" aria-live="polite"></aside>
    </section>

    <section class="side" aria-labelledby="rank-h">
      <div class="side-head">
        <h2 id="rank-h">Ranked sites</h2>
        <p class="side-built" id="st-built"></p>
        <p class="side-sub" id="rank-sub">Ranking…</p>
      </div>

      <div class="tune">
        <div class="tune-head">
          <h3>Weights</h3>
          <button type="button" class="link" id="w-reset">Equal weights</button>
        </div>
        <div class="tune-grid" id="weights"></div>
        <p class="tune-hint" id="w-hint" role="status"></p>
        <p class="tune-note">The bar under each site shows what its score is made of. Shorter is better.</p>
      </div>

      <div class="list" id="list">
        <table class="rank">
          <colgroup><col class="c-rank"><col><col class="c-m1"><col class="c-m2"><col class="c-m3"><col class="c-m4"></colgroup>
          <thead>
            <tr>
              <th scope="col" class="c-rank">#</th>
              <th scope="col">Region</th>
              <th scope="col" class="n" style="--tone:var(--m1)">Congestion<span>% of hours</span></th>
              <th scope="col" class="n" style="--tone:var(--m2)">Carbon<span>t CO₂/yr</span></th>
              <th scope="col" class="n" style="--tone:var(--m3)">Cost<span>€ M</span></th>
              <th scope="col" class="n" style="--tone:var(--m4)">Connectivity<span>0 is best</span></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="list-foot"><button type="button" class="link" id="more" hidden>Show more</button><span id="rank-msg" role="status"></span></p>
      </div>
    </section>
  </main>
</div>

<article class="report" id="report" hidden></article>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
